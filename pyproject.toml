[project]
name = "ai-vibe-coding-kit"
version = "0.12.0"
description = "Multi-provider LLM API wrapper with cost tracking, structured output, and tool calling"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zoltan Csaszar" }]
readme = "README.md"
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.0.0,<2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.24.0",
    "sentence-transformers>=2.2.0",
]

[project.scripts]
ai-vibe-bench = "ai_vibe_coding.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.4.0",
    "responses>=0.25.0",
    "ollama>=0.3.0",
    "mistralai>=1.0.0",
    "cohere>=5.0.0",
    "google-genai>=1.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests with mocked HTTP calls",
    "integration: Integration tests requiring real API keys (skipped without keys)",
    "slow: Slow running tests",
]

[tool.setuptools.package-data]
ai_vibe_coding = ["static/*.html", "static/*.js", "static/*.css"]
