# GitHub Actions workflow for automated testing
# Trigger: push / pull_request to main
# Runs:    ruff lint check + pytest
#
# Copy this file into your own projects and tweak:
#   - Python version matrix (add/remove versions as needed)
#   - Dependencies: adjust `pip install` line to match your setup
#   - Test command: change `pytest` flags or add coverage

name: Test

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check

      - name: Test with pytest
        run: pytest -v --tb=short
