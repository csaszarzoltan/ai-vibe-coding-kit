<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Playground</title>
    <link rel="stylesheet" href="playground.css">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header>
        <h1>LLM Playground</h1>
    </header>
    <main id="main-content" tabindex="-1">
        <!-- Provider Selection -->
        <section id="provider-selector">
            <div class="section-heading-row">
                <h2>Providers</h2>
                <button id="refresh-provider-status" class="secondary-button" type="button">Refresh status</button>
            </div>
            <p id="provider-readiness-summary" class="readiness-summary" aria-live="polite">Checking provider readiness...</p>
            <label>
                <input type="checkbox" data-provider="openai" id="provider-openai">
                OpenAI
            </label>
            <label>
                <input type="checkbox" data-provider="anthropic" id="provider-anthropic">
                Anthropic
            </label>
            <label>
                <input type="checkbox" data-provider="deepseek" id="provider-deepseek">
                DeepSeek
            </label>
            <label>
                <input type="checkbox" data-provider="openrouter" id="provider-openrouter">
                OpenRouter
            </label>
            <label>
                <input type="checkbox" data-provider="mimo" id="provider-mimo">
                MiMo
            </label>
            <label>
                <input type="checkbox" data-provider="gemini" id="provider-gemini">
                Gemini
            </label>
            <label>
                <input type="checkbox" data-provider="mistral" id="provider-mistral">
                Mistral
            </label>
            <label>
                <input type="checkbox" data-provider="cohere" id="provider-cohere">
                Cohere
            </label>
            <label>
                <input type="checkbox" data-provider="ollama" id="provider-ollama">
                Ollama
            </label>
        </section>

        <!-- Prompt Input -->
        <section id="prompt-section">
            <h2>Prompt</h2>
            <textarea id="prompt-input" placeholder="Enter your prompt here..." rows="4"></textarea>
        </section>

        <section id="advanced-options" aria-labelledby="advanced-heading">
            <h2 id="advanced-heading">Run options</h2>
            <label for="system-prompt-input">System prompt <span class="optional">optional</span></label>
            <textarea id="system-prompt-input" placeholder="Set consistent behavior for every provider..." rows="2"></textarea>
        </section>

        <!-- Compare Button -->
        <button id="compare-btn" disabled>Compare</button>

        <!-- Select All / Clear All buttons (P1) -->
        <div id="toggle-controls">
            <button id="select-all-btn" type="button">Select All</button>
            <button id="clear-all-btn" type="button">Clear All</button>
        </div>

        <section class="results-toolbar" aria-label="Result controls">
            <label for="sort-results">Sort results</label>
            <select id="sort-results">
                <option value="latency">Lowest latency</option>
                <option value="cost">Lowest cost</option>
                <option value="provider">Provider name</option>
            </select>
        </section>

        <!-- Results Container -->
        <div id="results-grid" aria-live="polite" aria-busy="false"></div>

        <!-- Error banner placeholder -->
        <div id="error-banner" class="error-banner" role="alert" hidden></div>

        <section id="recent-runs" aria-labelledby="recent-runs-heading">
            <h2 id="recent-runs-heading">Recent comparisons</h2>
            <p class="empty-state">Your three most recent comparisons will appear here on this device.</p>
        </section>
    </main>
    <script src="playground.js"></script>
</body>
</html>
